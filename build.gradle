buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('compileJava') {
    outputs.cacheIf { false }
}

tasks.matching { it.name.startsWith('prepareRun') && it.name.endsWith('Compile') }.configureEach {
    dependsOn tasks.named('compileJava')
}

def localModRepo = file('devmods-maven')
def devLibDir = file('devmods')
def libJar = new File(devLibDir, 'kaleidoscope_lib-1.1.0-forge-mc1.20.1.jar')

def devModMappings = [
    'ContingameIME'      : ['contingameime','1.0.7-1.20.1-forge'],
    'ModernUI'           : ['modernui','1.20.1-3.12.0.1-universal'],
    'MouseTweaks'        : ['mousetweaks','forge-mc1.20.1-2.25.1'],
    'appleskin'          : ['appleskin','forge-mc1.20.1-2.5.1'],
    'architectury'       : ['architectury','9.2.14-forge'],
    'cloth-config'       : ['cloth-config','11.1.136-forge'],
    'dummmmmmy'          : ['dummmmmmy','1.20-2.0.12-forge'],
    'embeddium'          : ['embeddium','0.3.31-mc1.20.1'],
    'ftb-library'        : ['ftb-library','forge-2001.2.13'],
    'ftb-ultimine'       : ['ftb-ultimine','forge-2001.1.8'],
    'jei'                : ['jei','1.20.1-forge-15.74.0.234'],
    'jade'               : ['jade','1.20.1-forge-11.13.3'],
    'kaleidoscopecookery': ['kaleidoscopecookery','1.6.0-forge-mc1.20.1'],
    'kaleidoscopetavern' : ['kaleidoscopetavern','1.2.0-forge-mc1.20.1'],
    'kotlinforforge'     : ['kotlinforforge','4.12.0-all'],
    'legendarymonsters'  : ['legendarymonsters','2.2.4-MC-1.20.1'],
    'mezz_config'        : ['mezz-config','1.20.1-forge-0.6.10'],
    'moonlight'          : ['moonlight','1.20-2.16.39-forge'],
    'oculus'             : ['oculus','mc1.20.1-1.8.0'],
    'stepitup'           : ['stepitup','2.0.1-1.20.1-forge'],
]

tasks.register('buildLocalModRepo') {
    def src = file(dev_mods_dir)
    inputs.dir src
    inputs.file libJar
    outputs.dir localModRepo
    doLast {
        src.listFiles().each { f ->
            if (!f.name.endsWith('.jar')) return
            def m = devModMappings.find { k, v ->
                f.name.toLowerCase().startsWith(k.toLowerCase() + '-') || f.name.toLowerCase() == k.toLowerCase() + '.jar'
            }
            if (m == null) { logger.lifecycle("buildLocalModRepo: skipping unmatched ${f.name}"); return }
            def (a, v) = m.value
            def dir = new File(localModRepo, "kaleidoscope/local/${a}/${v}")
            dir.mkdirs()
            copy {
                from(f)
                into(dir)
                rename { "${a}-${v}.jar" }
            }
            new File(dir, "${a}-${v}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>kaleidoscope.local</groupId>
  <artifactId>${a}</artifactId>
  <version>${v}</version>
  <packaging>jar</packaging>
</project>
"""
        }

        if (libJar.exists()) {
            def libA = 'kaleidoscope_lib'
            def libV = '1.1.0-forge-mc1.20.1'
            def gav = new File(localModRepo, "kaleidoscope/local/${libA}/${libV}")
            gav.mkdirs()
            copy {
                from(libJar)
                into(gav)
                rename { "${libA}-${libV}.jar" }
            }
            new File(gav, "${libA}-${libV}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>kaleidoscope.local</groupId>
  <artifactId>${libA}</artifactId>
  <version>${libV}</version>
  <packaging>jar</packaging>
</project>
"""
        } else {
            logger.lifecycle("buildLocalModRepo: ${libJar.name} not found, skipping kaleidoscope_lib install")
        }
    }
}

tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    dependsOn tasks.named('buildLocalModRepo')
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), tasks.named('buildLocalModRepo')
}

repositories {
    maven {
        url = uri('devmods-maven')
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("kaleidoscope.local:kaleidoscopecookery:1.6.0-forge-mc1.20.1")
    implementation fg.deobf("kaleidoscope.local:kaleidoscopetavern:1.2.0-forge-mc1.20.1")
    implementation fg.deobf("kaleidoscope.local:legendarymonsters:2.2.4-MC-1.20.1")
    implementation fg.deobf("kaleidoscope.local:kaleidoscope_lib:1.1.0-forge-mc1.20.1")
    runtimeOnly fg.deobf("kaleidoscope.local:oculus:mc1.20.1-1.8.0")
    runtimeOnly fg.deobf("kaleidoscope.local:embeddium:0.3.31-mc1.20.1")
    runtimeOnly fg.deobf("kaleidoscope.local:modernui:1.20.1-3.12.0.1-universal")
    runtimeOnly fg.deobf("kaleidoscope.local:contingameime:1.0.7-1.20.1-forge")
    runtimeOnly fg.deobf("kaleidoscope.local:mousetweaks:forge-mc1.20.1-2.25.1")
    runtimeOnly fg.deobf("kaleidoscope.local:appleskin:forge-mc1.20.1-2.5.1")
    runtimeOnly fg.deobf("kaleidoscope.local:architectury:9.2.14-forge")
    runtimeOnly fg.deobf("kaleidoscope.local:cloth-config:11.1.136-forge")
    runtimeOnly fg.deobf("kaleidoscope.local:dummmmmmy:1.20-2.0.12-forge")
    runtimeOnly fg.deobf("kaleidoscope.local:moonlight:1.20-2.16.39-forge")
    runtimeOnly fg.deobf("kaleidoscope.local:ftb-library:forge-2001.2.13")
    runtimeOnly fg.deobf("kaleidoscope.local:ftb-ultimine:forge-2001.1.8")
    runtimeOnly fg.deobf("kaleidoscope.local:jei:1.20.1-forge-15.74.0.234")
    runtimeOnly fg.deobf("kaleidoscope.local:jade:1.20.1-forge-11.13.3")
    runtimeOnly fg.deobf("kaleidoscope.local:kotlinforforge:4.12.0-all")
    runtimeOnly fg.deobf("kaleidoscope.local:mezz-config:1.20.1-forge-0.6.10")
    runtimeOnly fg.deobf("kaleidoscope.local:stepitup:2.0.1-1.20.1-forge")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name,
                             mod_license         : mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,
                             required_cookery_version_range: required_cookery_version_range,
                             required_tavern_version_range : required_tavern_version_range,
                             required_legendary_monsters_version_range: required_legendary_monsters_version_range,
                             required_lib_version_range: required_lib_version_range]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filteringCharset = 'UTF-8'

    exclude '**/.gitkeep'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title'     : mod_id,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
